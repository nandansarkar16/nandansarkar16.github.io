# Models the benchmark can run. To add one, copy an entry and give it a new id.
#
#   name / company  shown on the leaderboard
#   logo            Simple Icons slug (simpleicons.org); unknown slugs show the company's first letter
#   provider        anthropic | openai | gemini | openrouter | ollama
#   model           the provider's model id
#
# The model must accept images and tool calls. The Claude ids are current; the others
# are best guesses - check each provider's model list before running, and update them as
# new models come out.

claude-opus-5-5:
  name: Claude Opus 5.5
  company: Anthropic
  logo: claude
  provider: anthropic
  model: claude-opus-5-5
  effort: medium   # low | medium | high | xhigh | max

claude-sonnet-5-5:
  name: Claude Sonnet 5.5
  company: Anthropic
  logo: claude
  provider: anthropic
  model: claude-sonnet-5-5
  effort: medium

claude-haiku-5-5:
  name: Claude Haiku 5.5
  company: Anthropic
  logo: claude
  provider: anthropic
  model: claude-haiku-5-5
  effort: medium

gpt:
  name: GPT-5            # check platform.openai.com/docs/models
  company: OpenAI
  logo: openai
  provider: openai
  model: gpt-5

gemini:
  name: Gemini 2.5 Pro   # check ai.google.dev/gemini-api/docs/models
  company: Google
  logo: googlegemini
  provider: gemini
  model: gemini-2.5-pro

# Open models, run through OpenRouter (openrouter.ai/models - filter by "image input" and "tools")

gemma:
  name: Gemma 3 27B
  company: Google
  logo: google
  provider: openrouter
  model: google/gemma-3-27b-it

llama:
  name: Llama 4 Maverick
  company: Meta
  logo: meta
  provider: openrouter
  model: meta-llama/llama-4-maverick

kimi:
  name: Kimi               # pick a Kimi model with image input on OpenRouter
  company: Moonshot AI
  logo: kimi
  provider: openrouter
  model: moonshotai/kimi-vl-a3b-thinking

qwen:
  name: Qwen2.5 VL 72B
  company: Alibaba
  logo: qwen
  provider: openrouter
  model: qwen/qwen2.5-vl-72b-instruct
