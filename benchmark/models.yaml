# Models the benchmark can run. To add one, copy an entry and give it a new id.
#
#   name / company  shown on the leaderboard
#   logo            Simple Icons slug (simpleicons.org); unknown slugs show the company's first letter
#   provider        anthropic | openai | gemini | openrouter | ollama
#   model           the provider's model id
#
# The model must accept images and tool calls. The Claude ids are current; the others
# are best guesses - check each provider's model list before running, and update them as
# new models come out.

claude-opus-5-5:
  name: Claude Opus 5.5
  company: Anthropic
  logo: claude
  provider: anthropic
  model: claude-opus-5-5
  effort: medium   # low | medium | high | xhigh | max

claude-sonnet-5-5:
  name: Claude Sonnet 5.5
  company: Anthropic
  logo: claude
  provider: anthropic
  model: claude-sonnet-5-5
  effort: medium

claude-haiku-5-5:
  name: Claude Haiku 5.5
  company: Anthropic
  logo: claude
  provider: anthropic
  model: claude-haiku-5-5
  effort: medium

claude-opus-5-5-openrouter:
  name: Claude Opus 5.5 (OpenRouter)
  company: Anthropic
  logo: claude
  provider: openrouter
  model: anthropic/claude-opus-5.5

claude-sonnet-5-5-openrouter:
  name: Claude Sonnet 5.5 (OpenRouter)
  company: Anthropic
  logo: claude
  provider: openrouter
  model: anthropic/claude-sonnet-5.5

claude-haiku-5-5-openrouter:
